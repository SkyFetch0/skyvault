[package]
name = "skyvault"
version = "0.1.0"
description = "SkyVault - encrypted SSH vault"
authors = ["SkyVault contributors"]
license = "MIT"
repository = "https://github.com/SkyFetch0/skyvault"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skyvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1.54.1", features = ["full"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
zeroize = { version = "1.9.1", features = ["derive"] }
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
anyhow = "1.0.104"
getrandom = "0.4.3"
tauri-plugin-clipboard-manager = "2.5.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Argon2 is painfully slow unoptimized; keep deps fast in dev builds.
[profile.dev.package."*"]
opt-level = 2
